services:
  pota-board:
    build: .
    container_name: pota-board
    restart: unless-stopped
    ports:
      - "8075:8075"
    environment:
      PORT: 8075
      # HamLog integration (read by the /api proxy once built; blank is fine until then)
      HAMLOG_URL: ${HAMLOG_URL:-http://192.168.1.62:8050}
      HAMLOG_USER: ${HAMLOG_USER:-}
      HAMLOG_PASS: ${HAMLOG_PASS:-}
      # Free CARTO basemap key — without it the Color/Dark maps are watermarked.
      # https://carto.com/basemaps/apikey/
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    # Compose already reads .env from this directory for the ${VAR} values above,
    # so a .env file is all you need. Uncomment only to inject it directly instead:
    # env_file: .env
